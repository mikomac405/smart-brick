[package]
edition = "2024"
name = "hardware_core"
version = "0.1.0"
authors = ["mikomac405"]
resolver = "2"

[[bin]]
name = "hardware_core"
test = false
bench = false

[dependencies]
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
embedded-io-async = "0.7"
embassy-stm32 = { version = "0.6", features = ["defmt", "stm32f103c8", "unstable-pac", "memory-x", "time-driver-tim2" ]  }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }

#embedded-hal = "1.0.0"
#embedded-hal-async = "1.0.0"
#embedded-io = "0.7"
#embedded-storage = "0.3.1"
#embassy-sync = { version = "0.8" }
#embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }



[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"
